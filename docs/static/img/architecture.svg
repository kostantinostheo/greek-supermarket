<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 Z" fill="#e87b35"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-skill" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 Z" fill="#e87b35"/>
    </marker>
  </defs>

  <!-- ===== CLIENT LAYER ===== -->
  <rect x="50" y="20" width="650" height="105" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="50" font-size="13" font-weight="600" fill="#64748b">Client Layer</text>

  <rect x="80" y="62" width="110" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="135" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Claude Desktop</text>
  <text x="135" y="99" text-anchor="middle" font-size="9" fill="#7c3aed">AI Client</text>

  <rect x="205" y="62" width="110" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="260" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Claude Code</text>
  <text x="260" y="99" text-anchor="middle" font-size="9" fill="#7c3aed">CLI Agent</text>

  <rect x="330" y="62" width="110" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="385" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Cursor</text>
  <text x="385" y="99" text-anchor="middle" font-size="9" fill="#7c3aed">AI Client</text>

  <rect x="455" y="62" width="110" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="510" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">VS Code</text>
  <text x="510" y="99" text-anchor="middle" font-size="9" fill="#7c3aed">Copilot</text>

  <rect x="580" y="62" width="110" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="635" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Apps / Scripts</text>
  <text x="635" y="99" text-anchor="middle" font-size="9" fill="#7c3aed">HTTP Client</text>

  <!-- Arrows: Clients <-> Interfaces -->
  <line x1="205" y1="125" x2="205" y2="175" stroke="#e87b35" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="195" y="156" font-size="8" fill="#e87b35" text-anchor="end">runs commands</text>
  <line x1="225" y1="175" x2="225" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-up)"/>
  <text x="235" y="156" font-size="8" fill="#8b5cf6">results</text>

  <line x1="535" y1="125" x2="535" y2="175" stroke="#e87b35" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="525" y="156" font-size="8" fill="#e87b35" text-anchor="end">HTTP request</text>
  <line x1="555" y1="175" x2="555" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-up)"/>
  <text x="565" y="156" font-size="8" fill="#8b5cf6">JSON response</text>

  <!-- ===== INTERFACE LAYER ===== -->
  <rect x="50" y="175" width="650" height="170" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="205" font-size="13" font-weight="600" fill="#64748b">Interface Layer</text>

  <!-- Agent Skill -->
  <rect x="80" y="215" width="270" height="115" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="215" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Agent Skill</text>
  <text x="215" y="260" text-anchor="middle" font-size="10" fill="#64748b">SKILL.md + Python script · uv</text>

  <rect x="100" y="272" width="230" height="22" rx="4" fill="#fff7ed" stroke="#e87b35" stroke-width="0.8"/>
  <text x="215" y="287" text-anchor="middle" font-size="9" fill="#c2410c">search · category · merchant · categories</text>

  <rect x="100" y="300" width="230" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="215" y="315" text-anchor="middle" font-size="9" fill="#475569">on-disk cache · 60 min</text>

  <!-- REST API -->
  <rect x="400" y="215" width="270" height="115" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="535" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">REST API</text>
  <text x="535" y="260" text-anchor="middle" font-size="10" fill="#64748b">FastAPI · Port 8000 · Swagger UI</text>

  <rect x="420" y="272" width="230" height="22" rx="4" fill="#fff7ed" stroke="#e87b35" stroke-width="0.8"/>
  <text x="535" y="287" text-anchor="middle" font-size="9" fill="#c2410c">/api/v1/products · categories · merchants</text>

  <rect x="420" y="300" width="230" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="535" y="315" text-anchor="middle" font-size="9" fill="#475569">in-memory cache · 60 min</text>

  <!-- Arrows: Interfaces <-> Data -->
  <line x1="205" y1="345" x2="205" y2="395" stroke="#e87b35" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="195" y="376" font-size="8" fill="#e87b35" text-anchor="end">request</text>
  <line x1="225" y1="395" x2="225" y2="345" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-up)"/>
  <text x="235" y="376" font-size="8" fill="#8b5cf6">data</text>

  <line x1="535" y1="345" x2="535" y2="395" stroke="#e87b35" stroke-width="1.5" marker-end="url(#arrow-down)"/>
  <text x="525" y="376" font-size="8" fill="#e87b35" text-anchor="end">request</text>
  <line x1="555" y1="395" x2="555" y2="345" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-up)"/>
  <text x="565" y="376" font-size="8" fill="#8b5cf6">data</text>

  <!-- ===== DATA LAYER ===== -->
  <rect x="50" y="395" width="650" height="95" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="425" font-size="13" font-weight="600" fill="#64748b">Data Layer</text>

  <rect x="270" y="420" width="155" height="46" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="347" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">Public Price Data</text>

  <rect x="455" y="420" width="155" height="46" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="532" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">Product Catalog</text>
</svg>
